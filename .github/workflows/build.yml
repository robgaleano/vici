name: EAS Build (preview)

on:
  workflow_dispatch: # ✅ ACTIVE: build only when you press "Run workflow"
  # push:            # ⏸️ Phase 2: uncomment when main is release-worthy
  #   branches: [main]

jobs:
  build:
    name: build-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Queue EAS build
        working-directory: apps/mobile
        run: eas build --profile preview --platform all --non-interactive --no-wait
